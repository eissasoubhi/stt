name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: |
          node --check src/index.js
          node --check src/config.js
          node --check src/usage.js
          node --check src/translate.js
          node --check src/translation/nllb.js
          node --check src/providers/deepgram.js
          node --check src/providers/gemini.js
          node --check src/providers/chirp.js
      - run: |
          node --check ../extension/background.js
          node --check ../extension/content.js
